<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b19"><title>Alibaba Quest</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#172554,#070b19 65%);color:#e5f4ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:18px}main{width:min(100%,520px);text-align:center;border:1px solid #294e77;background:#081323e8;border-radius:20px;padding:24px 18px;box-shadow:0 0 35px #0ea5d455}h1{font-size:clamp(28px,7vw,44px);margin:8px 0;color:#67e8f9;text-shadow:0 0 14px #06b6d4}.tag{letter-spacing:.14em;color:#a5b4fc;font-size:12px}p{line-height:1.5}button{background:#06b6d4;color:#06111c;border:0;border-radius:12px;padding:14px 18px;font-weight:900;font-size:16px;cursor:pointer;margin:8px}button:disabled{opacity:.5}video{width:100%;max-height:58vh;object-fit:cover;border-radius:14px;background:#000;display:none}#status{min-height:56px;margin:15px 0;color:#a7f3d0;font-weight:700}#success{display:none;color:#fde68a;font-size:22px;text-shadow:0 0 12px #f59e0b}.small{font-size:12px;color:#94a3b8}</style></head><body><main><div class="tag">PERSONAL ARCADE EXPERIENCE</div><h1>ALIBABA QUEST</h1><p>Une mission secrète t'attend.<br>Active la caméra et vise l'œuvre pixel.</p><button id="start">▶ START SCAN</button><video id="video" playsinline autoplay muted></video><div id="status">Système en attente.</div><div id="success"><div>★ TARGET FOUND ★</div><p>PLAYER: ALIBABA</p><p>ACCESS GRANTED</p><p>🎉 SECRET LEVEL UNLOCKED 🎉</p></div><p class="small">Analyse locale dans le navigateur : le flux caméra n'est pas envoyé.</p></main><script src="https://docs.opencv.org/4.x/opencv.js"></script><script>
const btn=document.getElementById('start'),v=document.getElementById('video'),s=document.getElementById('status'),win=document.getElementById('success');let running=false,cvOK=false,targetDesc,targetKP,orb,matcher;
function waitOpenCV(){return new Promise((resolve,reject)=>{let n=0;function check(){if(window.cv&&cv.Mat&&cv.imread){if(cv instanceof Promise){cv.then(()=>resolve()).catch(reject)}else if(cv.Mat)resolve()}else if(n++>160)reject(Error('OpenCV n’a pas chargé. Recharge la page et réessaie.'));else setTimeout(check,250)}check()})}
async function prepare(){await waitOpenCV();const im=new Image();im.src='target.jpg';await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);let mat=cv.imread(c),gray=new cv.Mat();cv.cvtColor(mat,gray,cv.COLOR_RGBA2GRAY);mat.delete();orb=new cv.ORB(2500);targetKP=new cv.KeyPointVector();targetDesc=new cv.Mat();orb.detectAndCompute(gray,new cv.Mat(),targetKP,targetDesc);gray.delete();matcher=new cv.BFMatcher(cv.NORM_HAMMING,false);if(targetDesc.empty())throw Error('Référence sans caractéristiques détectables');}
async function begin(){btn.disabled=true;s.textContent='Initialisation...';try{await prepare();const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;v.style.display='block';await v.play();running=true;s.textContent='SCANNING... cadre toute la mosaïque';scan()}catch(e){s.textContent=e.message||'Erreur caméra';btn.disabled=false}}
function scan(){if(!running)return;if(v.readyState<2){requestAnimationFrame(scan);return}let frame,gray,kp,desc,mv,mask,src,dst,H;try{frame=cv.imread(v);gray=new cv.Mat();cv.cvtColor(frame,gray,cv.COLOR_RGBA2GRAY);kp=new cv.KeyPointVector();desc=new cv.Mat();orb.detectAndCompute(gray,new cv.Mat(),kp,desc);let good=[];if(!desc.empty()){mv=new cv.DMatchVectorVector();matcher.knnMatch(targetDesc,desc,mv,2);for(let i=0;i<mv.size();i++){let pair=mv.get(i);if(pair.size()>=2){let a=pair.get(0),b=pair.get(1);if(a.distance<0.78*b.distance)good.push(a)}}}s.textContent='SCANNING... '+good.length+' correspondances';if(good.length>=15){src=new cv.Mat(good.length,1,cv.CV_32FC2);dst=new cv.Mat(good.length,1,cv.CV_32FC2);for(let i=0;i<good.length;i++){let p=targetKP.get(good[i].queryIdx).pt,q=kp.get(good[i].trainIdx).pt;src.data32F[2*i]=p.x;src.data32F[2*i+1]=p.y;dst.data32F[2*i]=q.x;dst.data32F[2*i+1]=q.y}mask=new cv.Mat();H=cv.findHomography(src,dst,cv.RANSAC,6,mask);let inliers=H.empty()?0:cv.countNonZero(mask);s.textContent=`SCANNING... ${good.length} matches / ${inliers} fiables`;if(inliers>=12){running=false;win.style.display='block';s.textContent='TARGET IDENTIFIED ✓';btn.style.display='none';v.srcObject.getTracks().forEach(t=>t.stop())}}}catch(e){console.error(e)}finally{[frame,gray,kp,desc,mv,mask,src,dst,H].forEach(x=>{if(x)x.delete()})}if(running)requestAnimationFrame(scan)}btn.addEventListener('click',begin);
</script></body></html>
