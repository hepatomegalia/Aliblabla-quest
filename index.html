<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIBABA QUEST</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080812;
  color: #00ffcc;
  font-family: monospace;
  text-align: center;
  padding: 24px 16px;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: clamp(28px, 7vw, 44px);
  color: #ff49d6;
  text-shadow: 3px 3px #700070;
}

p {
  line-height: 1.6;
}

button {
  font-family: monospace;
  font-weight: bold;
  font-size: 16px;
  background: #00ffcc;
  color: #080812;
  border: 0;
  padding: 16px 24px;
  margin: 12px;
  border-radius: 8px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

video {
  display: block;
  width: 100%;
  max-width: 480px;
  margin: 20px auto;
  border: 3px solid #ff49d6;
  border-radius: 12px;
  background: black;
}

#status {
  color: #ffff00;
  min-height: 60px;
  margin: 20px auto;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

#success {
  color: #00ffcc;
  font-size: 22px;
  border: 2px solid #ff49d6;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
  background: #161626;
}

</style>
</head>

<body>

<div class="container">

<h1>🎮 ALIBABA QUEST 🎮</h1>

<p>PLAYER 1 : ALICIA</p>

<p>
Une quête secrète t'attend.<br>
Scanne le monde... et trouve le trésor.
</p>

<button id="start">START SCAN</button>

<div id="cameraArea" class="hidden">
  <video id="video" autoplay playsinline muted></video>
  <button id="stop">STOP CAMERA</button>
</div>

<p id="status">READY PLAYER ONE ?</p>

<div id="success" class="hidden">
  <h2>✨ LEVEL UNLOCKED ✨</h2>
  <p>TARGET FOUND!</p>
  <p>Alibaba, une surprise t'attend ! 💖</p>
</div>

</div>

<script>
const video = document.getElementById("video");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const cameraArea = document.getElementById("cameraArea");
const statusText = document.getElementById("status");
const success = document.getElementById("success");

let stream = null;
let scanning = false;
let scanTimer = null;

function setStatus(message) {
  statusText.textContent = message;
}

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    setStatus("Caméra indisponible. Ouvre le site dans Safari via HTTPS.");
    return;
  }

  startButton.disabled = true;
  setStatus("Ouverture de la caméra...");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    video.srcObject = stream;
    cameraArea.classList.remove("hidden");
    await video.play();

    scanning = true;
    startButton.classList.add("hidden");
    setStatus("Caméra prête ! Cherche le bonhomme orange et sa plateforme jaune.");

    scanTimer = setInterval(scanImage, 700);

  } catch (error) {
    startButton.disabled = false;
    setStatus("Caméra inaccessible. Autorise l'accès dans les réglages de Safari.");
  }
}

function scanImage() {
  if (!scanning || video.readyState < 2) return;

  const canvas = document.createElement("canvas");
  canvas.width = 320;
  canvas.height = 240;

  const ctx = canvas.getContext("2d", {
    willReadFrequently: true
  });

  ctx.drawImage(video, 0, 0, 320, 240);

  const pixels = ctx.getImageData(0, 0, 320, 240).data;

  let orange = 0;
  let yellow = 0;

  // Analyse un pixel sur quatre pour alléger le travail
  for (let i = 0; i < pixels.length; i += 16) {
    const r = pixels[i];
    const g = pixels[i + 1];
    const b = pixels[i + 2];

    if (r > 160 && g > 35 && g < 155 && b < 105 && r > g * 1.3) {
      orange++;
    }

    if (r > 175 && g > 105 && g < 220 && b < 100 && r > g * 1.05) {
      yellow++;
    }
  }

  setStatus("Recherche... Orange : " + orange + " | Jaune : " + yellow);

  // Les deux couleurs doivent être présentes ensemble
  if (orange > 100 && yellow > 100) {
    unlock();
  }
}

function unlock() {
  scanning = false;
  clearInterval(scanTimer);

  stopCamera();

  cameraArea.classList.add("hidden");
  success.classList.remove("hidden");
  setStatus("MISSION ACCOMPLIE !");
}

function stopCamera() {
  scanning = false;
  clearInterval(scanTimer);

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

startButton.addEventListener("click", startCamera);

stopButton.addEventListener("click", () => {
  stopCamera();
  cameraArea.classList.add("hidden");
  startButton.classList.remove("hidden");
  startButton.disabled = false;
  setStatus("SCAN ARRÊTÉ.");
});

window.addEventListener("pagehide", stopCamera);
</script>

</body>
</html>
