<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ALIBLABLA INVADERS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02030b;color:#e7faff;font-family:monospace;text-align:center;min-height:100vh;overflow-x:hidden;background-image:radial-gradient(#164a9a 1px,transparent 1px),radial-gradient(#15316a 1px,transparent 1px);background-size:47px 47px,83px 83px;background-position:0 0,20px 15px}.wrap{max-width:700px;margin:auto;padding:22px 15px}h1{font-size:clamp(26px,7vw,48px);color:#50dfff;text-shadow:0 0 8px #08f,0 0 25px #08f;letter-spacing:3px;margin:15px 0}.small{color:#f5d45b;letter-spacing:2px}.panel{border:2px solid #43bfff;box-shadow:0 0 15px #078cff,inset 0 0 12px #1267b8;border-radius:12px;padding:15px;margin:18px auto;background:#05091bcc}button{font: bold 18px monospace;color:#061126;background:#4ce5ff;border:2px solid white;box-shadow:0 0 15px #00bfff;padding:14px 22px;border-radius:5px;letter-spacing:2px;margin:12px;cursor:pointer}video{width:100%;display:block;border-radius:6px;background:#000}#view{position:relative}#guide{position:absolute;inset:8%;border:2px dashed #51ddff;box-shadow:0 0 12px #009dff;pointer-events:none}#status{min-height:2.5em;color:#ffe76b}.hidden{display:none!important}.score{color:#ffe66b;font-size:clamp(24px,6vw,36px);text-shadow:0 0 10px #f90}.victory{font-size:clamp(24px,6vw,36px);color:#ff59e9;text-shadow:0 0 12px #f0f}.victory p{margin:15px 0}.peanut{position:fixed;top:-50px;z-index:20;font-size:28px;animation:fall linear forwards;pointer-events:none;filter:drop-shadow(0 0 4px #ffd76a)}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}.pixel{image-rendering:pixelated}
</style></head><body><div class="wrap"><div class="small">★ INSERT COIN • PLAYER 1 ★</div><h1>ALIBLABLA<br>INVADERS</h1><div class="panel" id="intro"><p>SCAN THE MOSAIC TO UNLOCK YOUR BONUS</p><p class="small">+25 000 PTS awaits...</p><button id="start">▶ START SCAN</button></div><div id="cameraPanel" class="panel hidden"><div id="view"><video id="video" autoplay playsinline muted></video><div id="guide"></div></div><p class="small">Place toute la mosaïque dans le cadre</p><button id="stop">STOP</button></div><p id="status">READY PLAYER ONE?</p><div id="win" class="panel hidden"><div class="score">+25 000 PTS</div><div class="victory"><p>you found</p><p>Aliblabla_surfcollector</p><p>🎉HAPPY BIRTHDAY🎉</p></div><p class="small">BONUS UNLOCKED</p></div></div>
<script>
const video=document.getElementById('video'),start=document.getElementById('start'),stop=document.getElementById('stop'),cam=document.getElementById('cameraPanel'),intro=document.getElementById('intro'),status=document.getElementById('status'),win=document.getElementById('win');let stream=null,run=false,refData=null,scanCanvas=document.createElement('canvas');scanCanvas.width=32;scanCanvas.height=32;let scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true});
// A spatial colour signature compares a coarse, normalized thumbnail of the mosaic.
// The user should keep the entire artwork centered inside the guide.
function loadReference(){let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=32;c.height=32;let x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,32,32);refData=x.getImageData(0,0,32,32).data;status.textContent='Reference loaded. Centre the mosaic in the frame.'};im.onerror=()=>status.textContent='Reference image target.jpg missing.';im.src='target.jpg'}loadReference();
async function startCamera(){start.disabled=true;status.textContent='Opening camera...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();intro.classList.add('hidden');cam.classList.remove('hidden');run=true;status.textContent='Scanning... keep the artwork steady';loop()}catch(e){start.disabled=false;status.textContent='Camera unavailable. Allow camera access in Safari settings.'}}
function loop(){if(!run)return;requestAnimationFrame(loop);if(!refData||video.readyState<2)return;scanCtx.drawImage(video,0,0,32,32);let d=scanCtx.getImageData(0,0,32,32).data;let diff=0,n=0;for(let y=0;y<32;y++)for(let x=0;x<32;x++){let i=(y*32+x)*4; // compare chromaticity and brightness with moderate tolerance
let a=[d[i],d[i+1],d[i+2]],b=[refData[i],refData[i+1],refData[i+2]];let da=a[0]-a[1],db=b[0]-b[1],ea=a[2]-a[1],eb=b[2]-b[1];diff+=Math.abs(da-db)+Math.abs(ea-eb)+Math.abs(a[1]-b[1])*0.45;n++}let score=diff/n;status.textContent='Pattern check: '+Math.round(score)+' (keep artwork centered)';// conservative heuristic; prototype needs real-world tuning
if(score<24)unlock()}
function unlock(){run=false;stopCamera();cam.classList.add('hidden');win.classList.remove('hidden');status.textContent='MISSION COMPLETE!';rain()}
function stopCamera(){run=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
function rain(){for(let i=0;i<75;i++){let p=document.createElement('div');p.className='peanut';p.textContent='🥜';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(3+Math.random()*5)+'s';p.style.animationDelay=Math.random()*3+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),9000)}}
start.addEventListener('click',startCamera);stop.addEventListener('click',()=>{stopCamera();cam.classList.add('hidden');intro.classList.remove('hidden');start.disabled=false;status.textContent='SCAN PAUSED'});window.addEventListener('pagehide',stopCamera);
</script></body></html>
