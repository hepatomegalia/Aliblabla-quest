<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIBABA QUEST</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080812;
  color: #00ffcc;
  font-family: monospace;
  text-align: center;
  padding: 24px 16px;
}

.container {
  max-width: 600px;
  margin: auto;
}

h1 {
  font-size: clamp(28px, 7vw, 44px);
  color: #ff49d6;
  text-shadow: 3px 3px #700070;
}

p {
  line-height: 1.6;
}

button {
  font-family: monospace;
  font-weight: bold;
  font-size: 16px;
  background: #00ffcc;
  color: #080812;
  border: 0;
  padding: 16px 24px;
  margin: 12px;
  border-radius: 8px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

video {
  display: block;
  width: 100%;
  max-width: 480px;
  margin: 20px auto;
  border: 3px solid #ff49d6;
  border-radius: 12px;
  background: black;
}

#status {
  color: #ffff00;
  min-height: 60px;
  margin: 20px auto;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

#success {
  color: #00ffcc;
  font-size: 22px;
  border: 2px solid #ff49d6;
  border-radius: 12px;
  padding: 20px;
  margin-top: 20px;
  background: #161626;
}

</style>
</head>

<body>

<div class="container">

<h1>🎮 ALIBABA QUEST 🎮</h1>

<p>PLAYER 1 : ALICIA</p>

<p>
Une quête secrète t'attend.<br>
Scanne le monde... et trouve le trésor.
</p>

<button id="start">START SCAN</button>

<div id="cameraArea" class="hidden">
  <video id="video" autoplay playsinline muted></video>
  <button id="stop">STOP CAMERA</button>
</div>

<p id="status">READY PLAYER ONE ?</p>

<div id="success" class="hidden">
  <h2>✨ LEVEL UNLOCKED ✨</h2>
  <p>TARGET FOUND!</p>
  <p>Alibaba, une surprise t'attend ! 💖</p>
</div>

</div>

<script>
const video = document.getElementById("video");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const cameraArea = document.getElementById("cameraArea");
const statusText = document.getElementById("status");
const success = document.getElementById("success");

let stream = null;
let scanning = false;
let cvReady = false;
let targetDescriptors = null;
let orb = null;
let lastScan = 0;
let scanBusy = false;

function setStatus(message) {
  statusText.textContent = message;
}

// Load OpenCV in background
function loadCV() {
  if (cvReady || window.cv) {
    waitForCV();
    return;
  }

  const script = document.createElement("script");
  script.src = "https://docs.opencv.org/4.x/opencv.js";
  script.async = true;

  script.onerror = () => {
    setStatus("Impossible de charger le moteur de reconnaissance. Vérifie ta connexion.");
  };

  document.head.appendChild(script);
  waitForCV();
}

function waitForCV() {
  const timeout = Date.now() + 30000;

  const check = () => {
    if (window.cv && window.cv.Mat) {
      initializeCV();
      return;
    }

    if (Date.now() > timeout) {
      setStatus("Le moteur de reconnaissance met trop de temps à charger.");
      return;
    }

    setTimeout(check, 250);
  };

  check();
}

function initializeCV() {
  try {
    orb = new cv.ORB(600);
    loadTarget();
  } catch (e) {
    setStatus("Erreur d'initialisation du moteur.");
  }
}

function loadTarget() {
  const image = new Image();
  image.crossOrigin = "anonymous";
  image.src = "target.jpg";

  image.onload = () => {
    try {
      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = Math.round(
        image.height * 480 / image.width
      );

      const ctx = canvas.getContext("2d");
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

      const gray = cv.imread(canvas);
      const keypoints = new cv.KeyPointVector();
      const descriptors = new cv.Mat();

      orb.detectAndCompute(
        gray,
        new cv.Mat(),
        keypoints,
        descriptors
      );

      gray.delete();
      keypoints.delete();

      if (descriptors.empty()) {
        descriptors.delete();
        setStatus("Image cible trop difficile à analyser.");
        return;
      }

      targetDescriptors = descriptors;
      cvReady = true;

      if (scanning) {
        setStatus("Moteur prêt ! Recherche de la mosaïque...");
      }

    } catch (e) {
      setStatus("Impossible d'analyser l'image cible.");
    }
  };

  image.onerror = () => {
    setStatus("Image target.jpg introuvable.");
  };
}

async function startCamera() {
  startButton.disabled = true;
  setStatus("Ouverture de la caméra...");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = stream;
    cameraArea.classList.remove("hidden");

    await video.play();

    scanning = true;
    startButton.classList.add("hidden");

    setStatus("Caméra active ! Prépare ta mosaïque...");

    loadCV();
    requestAnimationFrame(scanLoop);

  } catch (e) {
    startButton.disabled = false;

    setStatus(
      "Caméra inaccessible. Ouvre le site dans Safari et autorise la caméra."
    );
  }
}

function scanLoop() {
  if (!scanning) return;

  requestAnimationFrame(scanLoop);

  if (!cvReady || scanBusy || video.readyState < 2) return;

  if (Date.now() - lastScan < 1200) return;

  lastScan = Date.now();
  scanBusy = true;

  try {
    performScan();
  } catch (e) {
    console.log(e);
  }

  scanBusy = false;
}

function performScan() {
  if (!video.videoWidth || !targetDescriptors) return;

  const canvas = document.createElement("canvas");
  const width = 480;
  const height = Math.round(
    video.videoHeight * width / video.videoWidth
  );

  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0, width, height);

  const frame = cv.imread(canvas);
  const gray = new cv.Mat();

  cv.cvtColor(frame, gray, cv.COLOR_RGBA2GRAY);

  const keypoints = new cv.KeyPointVector();
  const descriptors = new cv.Mat();

  orb.detectAndCompute(
    gray,
    new cv.Mat(),
    keypoints,
    descriptors
  );

  frame.delete();
  gray.delete();
  keypoints.delete();

  if (descriptors.empty()) {
    descriptors.delete();
    return;
  }

  const matcher = new cv.BFMatcher(cv.NORM_HAMMING, false);
  const matches = new cv.DMatchVectorVector();

  matcher.knnMatch(
    targetDescriptors,
    descriptors,
    matches,
    2
  );

  let good = 0;

  for (let i = 0; i < matches.size(); i++) {
    const pair = matches.get(i);

    if (pair.size() >= 2) {
      const m = pair.get(0);
      const n = pair.get(1);

      if (m.distance < 0.72 * n.distance) {
        good++;
      }

      m.delete();
      n.delete();
    }

    pair.delete();
  }

  matches.delete();
  matcher.delete();
  descriptors.delete();

  if (good >= 22) {
    unlock();
  } else {
    setStatus(
      "Recherche en cours... (" + good + " correspondances)"
    );
  }
}

function unlock() {
  scanning = false;

  cameraArea.classList.add("hidden");
  success.classList.remove("hidden");

  setStatus("MISSION ACCOMPLIE !");

  stopCamera();
}

function stopCamera() {
  scanning = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", () => {
  stopCamera();
  cameraArea.classList.add("hidden");
  startButton.classList.remove("hidden");
  startButton.disabled = false;
  setStatus("SCAN ARRÊTÉ.");
});

window.addEventListener("pagehide", stopCamera);

</script>
</body>
</html>
