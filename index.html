<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ALIBLABLA INVADERS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02030b;color:#e7faff;font-family:monospace;text-align:center;min-height:100vh;overflow-x:hidden;background-image:radial-gradient(#164a9a 1px,transparent 1px),radial-gradient(#15316a 1px,transparent 1px);background-size:47px 47px,83px 83px;background-position:0 0,20px 15px}.wrap{max-width:700px;margin:auto;padding:22px 15px}h1{font-size:clamp(26px,7vw,48px);color:#50dfff;text-shadow:0 0 8px #08f,0 0 25px #08f;letter-spacing:3px;margin:15px 0}.small{color:#f5d45b;letter-spacing:2px}.panel{border:2px solid #43bfff;box-shadow:0 0 15px #078cff,inset 0 0 12px #1267b8;border-radius:12px;padding:15px;margin:18px auto;background:#05091bcc}button{font:bold 18px monospace;color:#061126;background:#4ce5ff;border:2px solid white;box-shadow:0 0 15px #00bfff;padding:14px 22px;border-radius:5px;letter-spacing:2px;margin:12px;cursor:pointer}video{width:100%;display:block;border-radius:6px;background:#000}#view{position:relative}#guide{position:absolute;left:23%;right:23%;top:10%;bottom:10%;border:2px dashed #51ddff;box-shadow:0 0 12px #009dff;pointer-events:none;border-radius:12px}#guide:after{content:'BONHOMME ORANGE';position:absolute;top:-25px;left:0;right:0;color:#ffe66b;font-size:12px;text-shadow:0 0 8px #f90}#status{min-height:2.5em;color:#ffe76b}.hidden{display:none!important}.score{color:#ffe66b;font-size:clamp(24px,6vw,36px);text-shadow:0 0 10px #f90}.victory{font-size:clamp(24px,6vw,36px);color:#ff59e9;text-shadow:0 0 12px #f0f}.victory p{margin:15px 0}.peanut{position:fixed;top:-50px;z-index:20;font-size:28px;animation:fall linear forwards;pointer-events:none;filter:drop-shadow(0 0 4px #ffd76a)}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style></head><body><div class="wrap"><div class="small">★ INSERT COIN • PLAYER 1 ★</div><h1>ALIBLABLA<br>INVADERS</h1><div class="panel" id="intro"><p>FIND THE ORANGE HERO TO UNLOCK YOUR BONUS</p><p class="small">+25 000 PTS awaits...</p><button id="start">▶ START SCAN</button></div><div id="cameraPanel" class="panel hidden"><div id="view"><video id="video" autoplay playsinline muted></video><div id="guide"></div></div><p class="small">Place le bonhomme orange dans le cadre</p><button id="stop">STOP</button></div><p id="status">READY PLAYER ONE?</p><div id="win" class="panel hidden"><div class="score">+25 000 PTS</div><div class="victory"><p>you found Aliblabla_surfcollector :</p><p>🎉HAPPY BIRTHDAY🎉</p></div><p class="small">BONUS UNLOCKED</p></div></div>
<script>
const video=document.getElementById('video'),start=document.getElementById('start'),stop=document.getElementById('stop'),cam=document.getElementById('cameraPanel'),intro=document.getElementById('intro'),status=document.getElementById('status'),win=document.getElementById('win');let stream=null,run=false,template=null,lastHit=0;const W=32,H=32,canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d',{willReadFrequently:true});
// Build a compact silhouette template from the orange character in the supplied mosaic photo.
function orangeMask(data,w,h){const mask=new Uint8Array(w*h);for(let i=0;i<w*h;i++){const r=data[i*4]/255,g=data[i*4+1]/255,b=data[i*4+2]/255,max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let hue=0;if(d){if(max===r)hue=((g-b)/d)%6;else if(max===g)hue=(b-r)/d+2;else hue=(r-g)/d+4;hue=(hue*60+360)%360}const sat=max?d/max:0;mask[i]=(hue>7&&hue<27&&sat>.42&&max>.22)?1:0}return mask}
function makeTemplate(){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0);const d=x.getImageData(0,0,c.width,c.height).data;const raw=orangeMask(d,c.width,c.height); // isolate the character area; the yellow surfboard/platform is deliberately excluded
const x0=Math.floor(c.width*.40),x1=Math.floor(c.width*.83),y0=Math.floor(c.height*.27),y1=Math.floor(c.height*.69);let count=0;for(let y=y0;y<y1;y++)for(let xx=x0;xx<x1;xx++)if(raw[y*c.width+xx])count++;if(count<100){status.textContent='Reference image could not be prepared.';return}template=new Uint8Array(W*H);for(let yy=0;yy<H;yy++)for(let xx=0;xx<W;xx++){const sx=Math.floor(x0+(xx+.5)*(x1-x0)/W),sy=Math.floor(y0+(yy+.5)*(y1-y0)/H);template[yy*W+xx]=raw[sy*c.width+sx]}status.textContent='ORANGE HERO READY — point the camera at the character.'};im.onerror=()=>status.textContent='Reference image target.jpg missing.';im.src='target.jpg'}makeTemplate();
function frameMask(){ctx.drawImage(video,0,0,W,H);const d=ctx.getImageData(0,0,W,H).data;return orangeMask(d,W,H)}
function compare(){if(!template||video.readyState<2)return;const m=frameMask();let total=0,minX=W,minY=H,maxX=-1,maxY=-1;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(m[y*W+x]){total++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}if(total<8||maxX-minX<3||maxY-minY<4){status.textContent='Pattern check: cherche le bonhomme orange…';return}
// Normalize the detected orange silhouette to the reference grid and compare overlap.
let hit=0,union=0,refCount=0;for(const v of template)refCount+=v;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const sx=Math.min(W-1,Math.max(0,Math.floor(minX+(x+.5)*(maxX-minX+1)/W))),sy=Math.min(H-1,Math.max(0,Math.floor(minY+(y+.5)*(maxY-minY+1)/H)));const a=template[y*W+x],b=m[sy*W+sx];if(a&&b)hit++;if(a||b)union++}const similarity=union?hit/union:0;const fill=total/(W*H);status.textContent='ORANGE HERO CHECK: '+Math.round(similarity*100)+'% — centre le personnage';if(similarity>.38&&fill>.035&&fill<.78){if(Date.now()-lastHit>1200){lastHit=Date.now();unlock()}}}
async function startCamera(){start.disabled=true;status.textContent='Opening camera...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();intro.classList.add('hidden');cam.classList.remove('hidden');run=true;status.textContent='Scanning the orange hero...';loop()}catch(e){start.disabled=false;status.textContent='Camera unavailable. Allow camera access in Safari settings.'}}
function loop(){if(!run)return;compare();requestAnimationFrame(loop)}function unlock(){run=false;stopCamera();cam.classList.add('hidden');win.classList.remove('hidden');status.textContent='MISSION COMPLETE!';rain()}function stopCamera(){run=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}function rain(){for(let i=0;i<75;i++){const p=document.createElement('div');p.className='peanut';p.textContent='🥜';p.style.left=Math.random()*100+'vw';p.style.animationDuration=(3+Math.random()*5)+'s';p.style.animationDelay=Math.random()*3+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),9000)}}start.addEventListener('click',startCamera);stop.addEventListener('click',()=>{stopCamera();cam.classList.add('hidden');intro.classList.remove('hidden');start.disabled=false;status.textContent='SCAN PAUSED'});window.addEventListener('pagehide',stopCamera);
</script></body></html>
